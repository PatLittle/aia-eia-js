name: Test AIA PDF recovery

on:
  pull_request:
    branches:
      - master
    paths:
      - "scripts/recover_aia_json_from_pdf.py"
      - "scripts/aia_pdf_recovery_targets.json"
      - ".github/workflows/recover-aia-json.yml"

permissions:
  contents: write

jobs:
  recover-test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out PR branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install recovery dependencies
        run: python -m pip install --upgrade requests pymupdf rapidfuzz

      - name: Reconstruct and validate
        run: |
          rm -rf recovery_debug recovered_aia_json
          python scripts/recover_aia_json_from_pdf.py \
            --output-dir recovered_aia_json \
            --debug-dir recovery_debug \
            --keep-pdfs

      - name: Commit branch test outputs
        env:
          BRANCH_NAME: ${{ github.head_ref }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add recovered_aia_json recovery_debug
          if git diff --cached --quiet; then
            echo "No test outputs changed."
            exit 0
          fi
          git commit -m "test: capture AIA recovery diagnostics"
          git push origin "HEAD:$BRANCH_NAME"

      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: aia-pdf-json-recovery-diagnostics
          path: recovery_debug
          if-no-files-found: warn
