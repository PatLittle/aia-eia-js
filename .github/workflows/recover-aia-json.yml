name: Recover missing AIA JSON from PDFs

on:
  workflow_dispatch:
  push:
    branches:
      - master
    paths:
      - "scripts/recover_aia_json_from_pdfs.py"
      - "scripts/build_aia_jsonl.py"
      - "scripts/aia_pdf_recovery_targets.json"
      - ".github/workflows/recover-aia-json.yml"

permissions:
  contents: write

concurrency:
  group: recover-aia-json
  cancel-in-progress: false

jobs:
  recover:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install recovery dependencies
        run: python -m pip install --upgrade requests pymupdf rapidfuzz

      - name: Reconstruct and validate bilingual AIA JSON files
        run: |
          rm -rf recovery_debug recovered_aia_json
          python scripts/recover_aia_json_from_pdfs.py \
            --output-dir recovered_aia_json \
            --debug-dir recovery_debug

      - name: Validate recovered files through the JSONL pipeline
        run: |
          python scripts/build_aia_jsonl.py \
            --recovered-dir recovered_aia_json \
            --output /tmp/aia-results.jsonl \
            --summary-output /tmp/aia-results-summary.json
          cat /tmp/aia-results-summary.json

      - name: Commit reconstructed bilingual JSON files
        env:
          BRANCH_NAME: ${{ github.ref_name }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -u recovered_aia_json
          git add recovered_aia_json/*/aia-results.json
          if git diff --cached --quiet; then
            echo "No reconstructed JSON files changed."
            exit 0
          fi
          git commit -m "chore: recover bilingual AIA JSON from published PDFs"
          git pull --rebase origin "$BRANCH_NAME"
          git push origin "HEAD:$BRANCH_NAME"

      - name: Upload recovery diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: aia-pdf-json-recovery-diagnostics
          path: recovery_debug
          if-no-files-found: warn
