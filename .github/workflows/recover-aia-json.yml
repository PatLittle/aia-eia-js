name: Recover missing AIA JSON from PDFs

on:
  workflow_dispatch:
  push:
    branches:
      - master
      - pdf-json-recovery-work
    paths:
      - "scripts/recover_aia_json_from_pdf.py"
      - "scripts/aia_pdf_recovery_targets.json"
      - ".github/workflows/recover-aia-json.yml"

permissions:
  contents: write

jobs:
  recover:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install recovery dependencies
        run: python -m pip install --upgrade requests pymupdf rapidfuzz

      - name: Reconstruct AIA JSON files
        run: |
          rm -rf recovery_debug
          python scripts/recover_aia_json_from_pdf.py \
            --output-dir recovered_aia_json \
            --debug-dir recovery_debug \
            --keep-pdfs

      - name: Show control validation
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p = Path("recovery_debug/control/comparison.json")
          report = json.loads(p.read_text(encoding="utf-8"))
          print(json.dumps({
              "expected_version": report["expected_version"],
              "recovered_version": report["recovered_version"],
              "expected_currentPage": report["expected_currentPage"],
              "recovered_currentPage": report["recovered_currentPage"],
              "expected_key_count": report["expected_key_count"],
              "recovered_key_count": report["recovered_key_count"],
              "common_key_count": report["common_key_count"],
              "key_recall": report["key_recall"],
              "choice_fields_compared": report["choice_fields_compared"],
              "choice_exact_count": report["choice_exact_count"],
              "choice_accuracy": report["choice_accuracy"],
              "missing_keys": report["missing_keys"],
          }, indent=2))
          PY

      - name: Commit reconstructed JSON and test-branch diagnostics
        env:
          BRANCH_NAME: ${{ github.ref_name }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add recovered_aia_json
          if [ "$BRANCH_NAME" != "master" ]; then
            git add recovery_debug
          fi
          if git diff --cached --quiet; then
            echo "No reconstructed files changed."
            exit 0
          fi
          git commit -m "chore: recover missing AIA JSON from published PDFs"
          git push origin "HEAD:$BRANCH_NAME"

      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: aia-pdf-json-recovery-diagnostics
          path: recovery_debug
          if-no-files-found: warn
