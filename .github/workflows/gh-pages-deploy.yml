name: Build and deploy GitHub Pages

on:
  workflow_dispatch:
  schedule:
    # Mondays at 10:00 UTC (06:00 EDT / 05:00 EST).
    - cron: "0 10 * * 1"
  push:
    branches:
      - master

concurrency:
  group: aia-pages-refresh
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
        with:
          ref: master
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-aia-report.txt

      - name: Install report dependencies
        run: python -m pip install -r requirements-aia-report.txt

      - name: Discover and recover new catalogue assessments
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        run: |
          python -m pip install pymupdf rapidfuzz
          python scripts/refresh_aia_catalogue.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/aia_pdf_recovery_targets.json recovered_aia_json/*/aia-results.json
          if ! git diff --cached --quiet; then
            git commit -m "Refresh AIA PDF recoveries from Open Canada"
            git pull --rebase origin master
            git push origin HEAD:master
          fi

      - name: Upload recovery diagnostics
        if: always() && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
        uses: actions/upload-artifact@v4
        with:
          name: weekly-aia-recovery-diagnostics
          path: recovery_debug
          if-no-files-found: ignore

      - name: Build unified bilingual AIA JSONL
        run: |
          mkdir -p public/aia-analysis-data
          python scripts/build_aia_jsonl.py \
            --output public/aia-analysis-data/aia-results.jsonl \
            --summary-output public/aia-analysis-data/aia-results-summary.json \
            --recovered-dir recovered_aia_json

      - name: Execute JSONL-backed AIA analysis notebook
        env:
          AIA_REPORT_OUTPUT_DIR: ${{ github.workspace }}/report-output
          AIA_JSONL_PATH: ${{ github.workspace }}/public/aia-analysis-data/aia-results.jsonl
          MPLBACKEND: Agg
        run: >-
          jupyter nbconvert
          --to notebook
          --execute aia_analysis_report.ipynb
          --output executed-aia_analysis_report.ipynb
          --ExecutePreprocessor.timeout=1800

      - name: Add report data to the site
        run: |
          cp report-output/*.csv public/aia-analysis-data/ 2>/dev/null || true
          python scripts/build_aia_site_assets.py \
            --jsonl public/aia-analysis-data/aia-results.jsonl \
            --public-dir public

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: "24.x"
          cache: npm

      - run: npm ci
      - run: npm run build
        env:
          NODE_OPTIONS: --openssl-legacy-provider

      - name: deploy
        uses: peaceiris/actions-gh-pages@v4.1.0
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
