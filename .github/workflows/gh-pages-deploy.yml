name: Build and deploy GitHub Pages

on:
  workflow_dispatch:
  push:
    branches:
      - master

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-aia-report.txt

      - name: Install report dependencies
        run: python -m pip install -r requirements-aia-report.txt

      - name: Build unified bilingual AIA JSONL
        run: |
          mkdir -p public/aia-analysis-data
          python scripts/build_aia_jsonl.py \
            --output public/aia-analysis-data/aia-results.jsonl \
            --summary-output public/aia-analysis-data/aia-results-summary.json \
            --recovered-dir recovered_aia_json

      - name: Execute JSONL-backed AIA analysis notebook
        env:
          AIA_REPORT_OUTPUT_DIR: ${{ github.workspace }}/report-output
          AIA_JSONL_PATH: ${{ github.workspace }}/public/aia-analysis-data/aia-results.jsonl
          MPLBACKEND: Agg
        run: >-
          jupyter nbconvert
          --to notebook
          --execute aia_analysis_report.ipynb
          --output executed-aia_analysis_report.ipynb
          --ExecutePreprocessor.timeout=1800

      - name: Add report data to the site
        run: |
          cp report-output/*.csv public/aia-analysis-data/ 2>/dev/null || true
          python scripts/build_aia_site_assets.py \
            --jsonl public/aia-analysis-data/aia-results.jsonl \
            --public-dir public

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: "24.x"
          cache: npm

      - run: npm ci
      - run: npm run build
        env:
          NODE_OPTIONS: --openssl-legacy-provider

      - name: deploy
        uses: peaceiris/actions-gh-pages@v4.1.0
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
