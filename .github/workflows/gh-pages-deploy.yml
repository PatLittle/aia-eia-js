name: Build and deploy GitHub Pages

on:
  workflow_dispatch:
  push:
    branches:
      - master

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install report dependencies
        run: python -m pip install -r requirements-aia-report.txt

      - name: Execute AIA analysis notebook
        env:
          AIA_REPORT_OUTPUT_DIR: ${{ github.workspace }}/report-output
          MPLBACKEND: Agg
        run: >-
          jupyter nbconvert
          --to notebook
          --execute aia_analysis_report.ipynb
          --output executed-aia_analysis_report.ipynb
          --ExecutePreprocessor.timeout=1800

      - name: Add report and data to the site
        run: |
          cp report-output/aia_analysis_report.html public/aia_analysis_report.html
          mkdir -p public/aia-analysis-data
          cp report-output/*.csv public/aia-analysis-data/

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '16.x'
          cache: npm

      - run: npm ci
      - run: npm run build

      - name: deploy
        uses: peaceiris/actions-gh-pages@v3.9.0
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
